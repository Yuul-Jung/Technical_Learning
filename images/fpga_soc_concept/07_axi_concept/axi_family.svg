<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">AXI 계열의 역할 비교</text>
<rect class="dark" x="60" y="90" width="250" height="65" rx="8"/>
<text class="label darktext" x="185.0" y="122.5" text-anchor="middle" dominant-baseline="middle">AXI4</text>
<rect class="soft" x="60" y="175" width="250" height="55" rx="8"/>
<text class="label " x="185.0" y="202.5" text-anchor="middle" dominant-baseline="middle">Memory-Mapped</text>
<rect class="gray" x="60" y="250" width="250" height="55" rx="8"/>
<text class="label " x="185.0" y="277.5" text-anchor="middle" dominant-baseline="middle">Burst / 고성능 메모리</text>
<rect class="dark" x="360" y="90" width="250" height="65" rx="8"/>
<text class="label darktext" x="485.0" y="122.5" text-anchor="middle" dominant-baseline="middle">AXI4-Lite</text>
<rect class="soft" x="360" y="175" width="250" height="55" rx="8"/>
<text class="label " x="485.0" y="202.5" text-anchor="middle" dominant-baseline="middle">Memory-Mapped</text>
<rect class="gray" x="360" y="250" width="250" height="55" rx="8"/>
<text class="label " x="485.0" y="277.5" text-anchor="middle" dominant-baseline="middle">Register 제어</text>
<rect class="dark" x="660" y="90" width="250" height="65" rx="8"/>
<text class="label darktext" x="785.0" y="122.5" text-anchor="middle" dominant-baseline="middle">AXI4-Stream</text>
<rect class="soft" x="660" y="175" width="250" height="55" rx="8"/>
<text class="label " x="785.0" y="202.5" text-anchor="middle" dominant-baseline="middle">No Address</text>
<rect class="gray" x="660" y="250" width="250" height="55" rx="8"/>
<text class="label " x="785.0" y="277.5" text-anchor="middle" dominant-baseline="middle">연속 데이터 스트림</text></svg>