<svg xmlns="http://www.w3.org/2000/svg" width="950" height="360" viewBox="0 0 950 360" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="25" y="30" text-anchor="start">AXI4-Stream READY / VALID Handshake</text>
<text class="small" x="110" y="60" text-anchor="middle">0</text>
<text class="small" x="200" y="60" text-anchor="middle">1</text>
<text class="small" x="290" y="60" text-anchor="middle">2</text>
<text class="small" x="380" y="60" text-anchor="middle">3</text>
<text class="small" x="470" y="60" text-anchor="middle">4</text>
<text class="small" x="560" y="60" text-anchor="middle">5</text>
<text class="small" x="650" y="60" text-anchor="middle">6</text>
<text class="small" x="740" y="60" text-anchor="middle">7</text>
<text class="label" x="30" y="107" text-anchor="start">TVALID</text><path d="M 110 120 H 200 V 95 H 290 V 95 H 380 V 120 H 470 V 95 H 560 V 95 H 650 V 120 H 740 V 95 H 830" stroke="#4635B1" stroke-width="3" fill="none"/>
<text class="label" x="30" y="177" text-anchor="start">TREADY</text><path d="M 110 165 H 200 V 165 H 290 V 190 H 380 V 190 H 470 V 165 H 560 V 165 H 650 V 165 H 740 V 190 H 830" stroke="#4635B1" stroke-width="3" fill="none"/>
<circle cx="200" cy="255" r="10" fill="#1F6F4A"/>
<text class="small" x="200" y="290" text-anchor="middle">TRANSFER</text>
<circle cx="470" cy="255" r="10" fill="#1F6F4A"/>
<text class="small" x="470" y="290" text-anchor="middle">TRANSFER</text>
<circle cx="560" cy="255" r="10" fill="#1F6F4A"/>
<text class="small" x="560" y="290" text-anchor="middle">TRANSFER</text>
<text class="label" x="30" y="330" text-anchor="start">TVALID=1 AND TREADY=1 인 클럭 에지에서 데이터가 전달됩니다.</text></svg>