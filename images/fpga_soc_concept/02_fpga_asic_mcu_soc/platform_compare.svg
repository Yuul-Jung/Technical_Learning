<text class="small" x="130" y="350" text-anchor="middle">고정 하드웨어 + SW</text>
<rect class="dark" x="265" y="70" width="200" height="50" rx="8"/>
<text class="label darktext" x="365.0" y="95.0" text-anchor="middle" dominant-baseline="middle">FPGA</text>
<rect class="gray" x="285" y="135" width="160" height="45" rx="8"/>
