<svg xmlns="http://www.w3.org/2000/svg" width="940" height="310" viewBox="0 0 940 310" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Software 실행과 Hardware 병렬성의 차이</text>
<rect class="dark" x="70" y="90" width="260" height="70" rx="8"/>
<text class="label darktext" x="200.0" y="125.0" text-anchor="middle" dominant-baseline="middle">MCU / CPU</text>
<text class="small darktext" x="200.0" y="148" text-anchor="middle">Instruction 실행</text>
<rect class="gray" x="70" y="210" width="260" height="55" rx="8"/>
<text class="label " x="200.0" y="237.5" text-anchor="middle" dominant-baseline="middle">Fetch → Decode → Execute</text>
<rect class="dark" x="610" y="90" width="260" height="70" rx="8"/>
<text class="label darktext" x="740.0" y="125.0" text-anchor="middle" dominant-baseline="middle">FPGA</text>
<text class="small darktext" x="740.0" y="148" text-anchor="middle">동시에 존재하는 회로</text>
<rect class="soft" x="520" y="210" width="160" height="55" rx="8"/>
<text class="label " x="600.0" y="237.5" text-anchor="middle" dominant-baseline="middle">AND / MUX</text>
<rect class="soft" x="705" y="210" width="160" height="55" rx="8"/>
<text class="label " x="785.0" y="237.5" text-anchor="middle" dominant-baseline="middle">Counter / FSM</text>
<line class="line" x1="200" y1="160" x2="200" y2="205"/>
<line class="line" x1="740" y1="160" x2="600" y2="205"/>
<line class="line" x1="740" y1="160" x2="785" y2="205"/></svg>