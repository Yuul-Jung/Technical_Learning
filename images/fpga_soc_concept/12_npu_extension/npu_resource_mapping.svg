<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">NPU 연산이 FPGA 자원으로 매핑되는 방식</text>
<rect class="box" x="55" y="95" width="180" height="70" rx="8"/>
<text class="label " x="145.0" y="130.0" text-anchor="middle" dominant-baseline="middle">Weights</text>
<rect class="box" x="55" y="215" width="180" height="70" rx="8"/>
<text class="label " x="145.0" y="250.0" text-anchor="middle" dominant-baseline="middle">Activations</text>
<rect class="soft" x="330" y="95" width="190" height="70" rx="8"/>
<text class="label " x="425.0" y="130.0" text-anchor="middle" dominant-baseline="middle">BRAM / LUTRAM</text>
<rect class="soft" x="330" y="215" width="190" height="70" rx="8"/>
<text class="label " x="425.0" y="250.0" text-anchor="middle" dominant-baseline="middle">Input Buffer</text>
<rect class="dark" x="615" y="155" width="190" height="80" rx="8"/>
<text class="label darktext" x="710.0" y="195.0" text-anchor="middle" dominant-baseline="middle">DSP48E1 MAC</text>
<rect class="box" x="865" y="155" width="140" height="80" rx="8"/>
<text class="label " x="935.0" y="195.0" text-anchor="middle" dominant-baseline="middle">Output</text>
<line class="line" x1="235" y1="130" x2="325" y2="130"/>
<line class="line" x1="235" y1="250" x2="325" y2="250"/>
<line class="line" x1="520" y1="130" x2="610" y2="175"/>
<line class="line" x1="520" y1="250" x2="610" y2="215"/>
<line class="line" x1="805" y1="195" x2="860" y2="195"/></svg>