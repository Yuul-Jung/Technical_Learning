<rect class="soft" x="425" y="105" width="115" height="85" rx="8"/>
<text class="label " x="482.5" y="147.5" text-anchor="middle" dominant-baseline="middle">BRAM</text>
<text class="small " x="482.5" y="178" text-anchor="middle">Weights</text>
<line class="line" x1="540" y1="147" x2="557" y2="147"/>
<rect class="soft" x="560" y="105" width="115" height="85" rx="8"/>
<text class="label " x="617.5" y="147.5" text-anchor="middle" dominant-baseline="middle">DSP48E1</text>
