<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Accelerator 성능은 계산 + 데이터 이동으로 평가</text>
<rect class="gray" x="60" y="105" width="180" height="70" rx="8"/>
<text class="label " x="150.0" y="140.0" text-anchor="middle" dominant-baseline="middle">CPU Setup</text>
<rect class="soft" x="300" y="105" width="180" height="70" rx="8"/>
<text class="label " x="390.0" y="140.0" text-anchor="middle" dominant-baseline="middle">Input Transfer</text>
<rect class="dark" x="540" y="105" width="180" height="70" rx="8"/>
<text class="label darktext" x="630.0" y="140.0" text-anchor="middle" dominant-baseline="middle">HW Compute</text>
<rect class="soft" x="780" y="105" width="180" height="70" rx="8"/>
<text class="label " x="870.0" y="140.0" text-anchor="middle" dominant-baseline="middle">Output Transfer</text>
<line class="line" x1="240" y1="140" x2="295" y2="140"/>
<line class="line" x1="480" y1="140" x2="535" y2="140"/>
<line class="line" x1="720" y1="140" x2="775" y2="140"/>
<text class="label" x="510" y="245" text-anchor="middle">Total Latency = Setup + Input Move + Compute + Output Move</text></svg>