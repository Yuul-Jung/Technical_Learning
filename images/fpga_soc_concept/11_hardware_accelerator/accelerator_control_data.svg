<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Hardware Accelerator — Control Path와 Data Path 분리</text>
<rect class="dark" x="60" y="115" width="180" height="70" rx="8"/>
<text class="label darktext" x="150.0" y="150.0" text-anchor="middle" dominant-baseline="middle">MicroBlaze</text>
<rect class="soft" x="320" y="75" width="220" height="70" rx="8"/>
<text class="label " x="430.0" y="110.0" text-anchor="middle" dominant-baseline="middle">AXI4-Lite Control</text>
<text class="small " x="430.0" y="133" text-anchor="middle">start / mode</text>
<rect class="soft" x="320" y="220" width="220" height="70" rx="8"/>
<text class="label " x="430.0" y="255.0" text-anchor="middle" dominant-baseline="middle">Status Register</text>
<text class="small " x="430.0" y="278" text-anchor="middle">done / busy</text>
<rect class="box" x="650" y="95" width="250" height="180" rx="8"/>
<text class="label " x="775.0" y="175.0" text-anchor="middle" dominant-baseline="middle">Accelerator</text>
<text class="label " x="775.0" y="195.0" text-anchor="middle" dominant-baseline="middle">Datapath</text>
<line class="line" x1="240" y1="150" x2="315" y2="110"/>
<line class="line" x1="540" y1="110" x2="645" y2="140"/>
<line class="line" x1="645" y1="230" x2="540" y2="255"/>
<line class="line" x1="315" y1="255" x2="240" y2="180"/>
<text class="small" x="775" y="165" text-anchor="middle">BRAM / Stream → MAC → Result</text></svg>