<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">FPGA 연산 자원 — Memory와 DSP가 Datapath를 구성</text>
<rect class="gray" x="45" y="100" width="180" height="70" rx="8"/>
<text class="label " x="135.0" y="135.0" text-anchor="middle" dominant-baseline="middle">LUT RAM</text>
<text class="small " x="135.0" y="158" text-anchor="middle">작은 분산 메모리</text>
<rect class="soft" x="280" y="100" width="180" height="70" rx="8"/>
<text class="label " x="370.0" y="135.0" text-anchor="middle" dominant-baseline="middle">BRAM</text>
<text class="small " x="370.0" y="158" text-anchor="middle">Weight / Buffer</text>
<rect class="soft" x="515" y="100" width="180" height="70" rx="8"/>
<text class="label " x="605.0" y="135.0" text-anchor="middle" dominant-baseline="middle">DSP48E1</text>
<text class="small " x="605.0" y="158" text-anchor="middle">Multiply / MAC</text>
<rect class="gray" x="750" y="100" width="180" height="70" rx="8"/>
<text class="label " x="840.0" y="135.0" text-anchor="middle" dominant-baseline="middle">Register</text>
<text class="small " x="840.0" y="158" text-anchor="middle">Pipeline</text>
<line class="line" x1="225" y1="135" x2="275" y2="135"/>
<line class="line" x1="460" y1="135" x2="510" y2="135"/>
<line class="line" x1="695" y1="135" x2="745" y2="135"/>
<rect class="box" x="280" y="250" width="180" height="65" rx="8"/>
<text class="label " x="370.0" y="282.5" text-anchor="middle" dominant-baseline="middle">Input Feature</text>
<rect class="box" x="515" y="250" width="180" height="65" rx="8"/>
<text class="label " x="605.0" y="282.5" text-anchor="middle" dominant-baseline="middle">Accumulator</text>
<line class="line" x1="370" y1="250" x2="605" y2="175"/>
<line class="line" x1="605" y1="170" x2="605" y2="245"/></svg>