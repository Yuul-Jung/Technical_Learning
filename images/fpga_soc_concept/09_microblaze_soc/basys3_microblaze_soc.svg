<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="350" viewBox="0 0 1020 350" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Basys3 MicroBlaze SoC 목표 구조</text>
<rect class="dark" x="365" y="55" width="230" height="70" rx="8"/>
<text class="label darktext" x="480.0" y="90.0" text-anchor="middle" dominant-baseline="middle">MicroBlaze</text>
<rect class="soft" x="80" y="220" width="180" height="70" rx="8"/>
<text class="label " x="170.0" y="255.0" text-anchor="middle" dominant-baseline="middle">BRAM</text>
<text class="small " x="170.0" y="278" text-anchor="middle">Program / Data</text>
<rect class="gray" x="320" y="220" width="180" height="70" rx="8"/>
<text class="label " x="410.0" y="255.0" text-anchor="middle" dominant-baseline="middle">AXI GPIO</text>
<text class="small " x="410.0" y="278" text-anchor="middle">LED / SW</text>
<rect class="gray" x="550" y="220" width="180" height="70" rx="8"/>
<text class="label " x="640.0" y="255.0" text-anchor="middle" dominant-baseline="middle">AXI UART Lite</text>
<text class="small " x="640.0" y="278" text-anchor="middle">Serial</text>
<rect class="soft" x="780" y="220" width="180" height="70" rx="8"/>
<text class="label " x="870.0" y="255.0" text-anchor="middle" dominant-baseline="middle">Custom IP</text>
<text class="small " x="870.0" y="278" text-anchor="middle">User RTL</text>
<text class="label" x="480" y="165" text-anchor="middle">AXI / LMB</text>
<line class="line" x1="430" y1="125" x2="170" y2="215"/>
<line class="line" x1="470" y1="125" x2="410" y2="215"/>
<line class="line" x1="520" y1="125" x2="640" y2="215"/>
<line class="line" x1="560" y1="125" x2="870" y2="215"/></svg>