<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">SoC에서 Control과 Acceleration의 역할 분담</text>
<rect class="dark" x="70" y="95" width="220" height="80" rx="8"/>
<text class="label darktext" x="180.0" y="135.0" text-anchor="middle" dominant-baseline="middle">CPU</text>
<text class="small darktext" x="180.0" y="163" text-anchor="middle">조건 판단 / 제어</text>
<rect class="soft" x="365" y="95" width="220" height="80" rx="8"/>
<text class="label " x="475.0" y="135.0" text-anchor="middle" dominant-baseline="middle">AXI / Register</text>
<text class="small " x="475.0" y="163" text-anchor="middle">명령·상태</text>
<rect class="box" x="660" y="95" width="220" height="80" rx="8"/>
<text class="label " x="770.0" y="135.0" text-anchor="middle" dominant-baseline="middle">Custom RTL</text>
<text class="small " x="770.0" y="163" text-anchor="middle">병렬 Datapath</text>
<line class="line" x1="290" y1="135" x2="360" y2="135"/>
<line class="line" x1="585" y1="135" x2="655" y2="135"/>
<rect class="gray" x="365" y="235" width="220" height="65" rx="8"/>
<text class="label " x="475.0" y="267.5" text-anchor="middle" dominant-baseline="middle">Memory / Buffer</text>
<line class="line" x1="475" y1="175" x2="475" y2="230"/>
<line class="line" x1="770" y1="175" x2="585" y2="265"/></svg>