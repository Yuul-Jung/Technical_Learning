<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">MicroBlaze I/O 개념 — UG984 기반 교육용 재작성</text>
<rect class="dark" x="380" y="95" width="240" height="90" rx="8"/>
<text class="label darktext" x="500.0" y="140.0" text-anchor="middle" dominant-baseline="middle">MicroBlaze</text>
<text class="small darktext" x="500.0" y="173" text-anchor="middle">Harvard Architecture</text>
<rect class="soft" x="50" y="255" width="180" height="70" rx="8"/>
<text class="label " x="140.0" y="290.0" text-anchor="middle" dominant-baseline="middle">Instruction BRAM</text>
<text class="small " x="140.0" y="313" text-anchor="middle">ILMB</text>
<rect class="soft" x="270" y="255" width="180" height="70" rx="8"/>
<text class="label " x="360.0" y="290.0" text-anchor="middle" dominant-baseline="middle">Data BRAM</text>
<text class="small " x="360.0" y="313" text-anchor="middle">DLMB</text>
<rect class="gray" x="550" y="255" width="180" height="70" rx="8"/>
<text class="label " x="640.0" y="290.0" text-anchor="middle" dominant-baseline="middle">AXI Peripheral</text>
<text class="small " x="640.0" y="313" text-anchor="middle">M_AXI_DP</text>
<rect class="gray" x="770" y="255" width="180" height="70" rx="8"/>
<text class="label " x="860.0" y="290.0" text-anchor="middle" dominant-baseline="middle">AXI4-Stream</text>
<text class="small " x="860.0" y="313" text-anchor="middle">Direct stream</text>
<line class="line" x1="430" y1="185" x2="140" y2="250"/>
<line class="line" x1="480" y1="185" x2="360" y2="250"/>
<line class="line" x1="530" y1="185" x2="640" y2="250"/>
<line class="line" x1="575" y1="185" x2="860" y2="250"/></svg>