<svg xmlns="http://www.w3.org/2000/svg" width="970" height="350" viewBox="0 0 970 350" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Harvard 구조 — Instruction과 Data 경로 분리</text>
<rect class="dark" x="385" y="95" width="200" height="80" rx="8"/>
<text class="label darktext" x="485.0" y="135.0" text-anchor="middle" dominant-baseline="middle">MicroBlaze</text>
<rect class="soft" x="80" y="95" width="200" height="80" rx="8"/>
<text class="label " x="180.0" y="135.0" text-anchor="middle" dominant-baseline="middle">Instruction BRAM</text>
<rect class="soft" x="690" y="95" width="200" height="80" rx="8"/>
<text class="label " x="790.0" y="135.0" text-anchor="middle" dominant-baseline="middle">Data BRAM</text>
<line class="line" x1="280" y1="135" x2="380" y2="135"/>
<line class="line" x1="590" y1="135" x2="685" y2="135"/>
<text class="label" x="180" y="205" text-anchor="middle">ILMB</text>
<text class="label" x="790" y="205" text-anchor="middle">DLMB</text>
<rect class="gray" x="385" y="250" width="200" height="60" rx="8"/>
<text class="label " x="485.0" y="280.0" text-anchor="middle" dominant-baseline="middle">AXI Peripheral</text>
<line class="line" x1="485" y1="175" x2="485" y2="245"/></svg>