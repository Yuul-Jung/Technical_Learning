<svg xmlns="http://www.w3.org/2000/svg" width="950" height="330" viewBox="0 0 950 330" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">RTL을 Block Design에 넣는 두 경로 — UG994/UG1118 기반</text>
<rect class="dark" x="60" y="110" width="180" height="70" rx="8"/>
<text class="label darktext" x="150.0" y="145.0" text-anchor="middle" dominant-baseline="middle">Verilog RTL</text>
<rect class="soft" x="340" y="75" width="220" height="70" rx="8"/>
<text class="label " x="450.0" y="110.0" text-anchor="middle" dominant-baseline="middle">Module Reference</text>
<text class="small " x="450.0" y="133" text-anchor="middle">빠른 통합</text>
<rect class="soft" x="340" y="205" width="220" height="70" rx="8"/>
<text class="label " x="450.0" y="240.0" text-anchor="middle" dominant-baseline="middle">Package IP</text>
<text class="small " x="450.0" y="263" text-anchor="middle">재사용 / IP Catalog</text>
<rect class="box" x="690" y="110" width="200" height="70" rx="8"/>
<text class="label " x="790.0" y="145.0" text-anchor="middle" dominant-baseline="middle">Block Design</text>
<line class="line" x1="240" y1="145" x2="335" y2="110"/>
<line class="line" x1="240" y1="145" x2="335" y2="240"/>
<line class="line" x1="560" y1="110" x2="685" y2="145"/>
<line class="line" x1="560" y1="240" x2="685" y2="145"/></svg>