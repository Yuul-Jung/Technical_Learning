<svg xmlns="http://www.w3.org/2000/svg" width="990" height="280" viewBox="0 0 990 280" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">RTL에서 재사용 IP로 발전하는 단계</text>
<rect class="dark" x="25" y="115" width="160" height="85" rx="8"/>
<text class="label darktext" x="105.0" y="157.5" text-anchor="middle" dominant-baseline="middle">RTL Unit</text>
<text class="small darktext" x="105.0" y="188" text-anchor="middle">독립 검증</text>
<line class="line" x1="185" y1="157" x2="210" y2="157"/>
<rect class="soft" x="215" y="115" width="160" height="85" rx="8"/>
<text class="label " x="295.0" y="157.5" text-anchor="middle" dominant-baseline="middle">Module Ref</text>
<text class="small " x="295.0" y="188" text-anchor="middle">빠른 BD 연결</text>
<line class="line" x1="375" y1="157" x2="400" y2="157"/>
<rect class="soft" x="405" y="115" width="160" height="85" rx="8"/>
<text class="label " x="485.0" y="157.5" text-anchor="middle" dominant-baseline="middle">AXI Wrapper</text>
<text class="small " x="485.0" y="188" text-anchor="middle">인터페이스 표준화</text>
<line class="line" x1="565" y1="157" x2="590" y2="157"/>
<rect class="soft" x="595" y="115" width="160" height="85" rx="8"/>
<text class="label " x="675.0" y="157.5" text-anchor="middle" dominant-baseline="middle">Package IP</text>
<text class="small " x="675.0" y="188" text-anchor="middle">메타데이터/버전</text>
<line class="line" x1="755" y1="157" x2="780" y2="157"/>
<rect class="soft" x="785" y="115" width="160" height="85" rx="8"/>
<text class="label " x="865.0" y="157.5" text-anchor="middle" dominant-baseline="middle">IP Catalog</text>
<text class="small " x="865.0" y="188" text-anchor="middle">재사용</text></svg>