<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="390" viewBox="0 0 1030 390" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.small{font-size:13px} .label{font-size:15px;font-weight:700} .title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">FPGA 내부 구조 — RTL이 실제 자원으로 매핑되는 흐름</text>
<rect class="dark" x="40" y="115" width="160" height="85" rx="8"/>
<text class="label darktext" x="120.0" y="157.5" text-anchor="middle" dominant-baseline="middle">Verilog RTL</text>
<text class="small darktext" x="120.0" y="188" text-anchor="middle">논리/상태 기술</text>
<rect class="soft" x="280" y="115" width="190" height="85" rx="8"/>
<text class="label " x="375.0" y="157.5" text-anchor="middle" dominant-baseline="middle">Synthesis / Mapping</text>
<text class="small " x="375.0" y="188" text-anchor="middle">회로 추론·자원 선택</text>
<rect class="box" x="585" y="55" width="170" height="75" rx="8"/>
<text class="label " x="670.0" y="82.5" text-anchor="middle" dominant-baseline="middle">LUT + FF</text>
<text class="label " x="670.0" y="102.5" text-anchor="middle" dominant-baseline="middle">Slice / CLB</text>
<rect class="gray" x="585" y="155" width="170" height="75" rx="8"/>
<text class="label " x="670.0" y="192.5" text-anchor="middle" dominant-baseline="middle">BRAM</text>
<text class="small " x="670.0" y="218" text-anchor="middle">Block Memory</text>
<rect class="gray" x="585" y="255" width="170" height="75" rx="8"/>
<text class="label " x="670.0" y="292.5" text-anchor="middle" dominant-baseline="middle">DSP48E1</text>
<text class="small " x="670.0" y="318" text-anchor="middle">Multiply / MAC</text>
<rect class="soft" x="835" y="155" width="150" height="75" rx="8"/>
<text class="label " x="910.0" y="192.5" text-anchor="middle" dominant-baseline="middle">Routing / I/O</text>
<text class="small " x="910.0" y="218" text-anchor="middle">연결·외부 핀</text>
<line class="line" x1="200" y1="157" x2="275" y2="157"/>
<line class="line" x1="470" y1="157" x2="580" y2="92"/>
<line class="line" x1="470" y1="157" x2="580" y2="192"/>
<line class="line" x1="470" y1="157" x2="580" y2="292"/>
<line class="line" x1="755" y1="92" x2="830" y2="175"/>
<line class="line" x1="755" y1="192" x2="830" y2="192"/>
<line class="line" x1="755" y1="292" x2="830" y2="210"/>
<text class="small" x="515" y="365" text-anchor="middle">CLB · BRAM · DSP는 서로 다른 FPGA 자원이며 Routing으로 연결됩니다.</text></svg>