<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">UG474 Figure 1 기반 교육용 재작성 — CLB와 Slice 관계</text>
<rect class="gray" x="45" y="120" width="180" height="150" rx="8"/>
<text class="label " x="135.0" y="185.0" text-anchor="middle" dominant-baseline="middle">Switch</text>
<text class="label " x="135.0" y="205.0" text-anchor="middle" dominant-baseline="middle">Matrix</text>
<rect class="box" x="350" y="70" width="450" height="250" rx="8"/>
<text class="label " x="575.0" y="195.0" text-anchor="middle" dominant-baseline="middle"></text>
<text class="label" x="370" y="98" text-anchor="start">CLB</text>
<rect class="soft" x="520" y="105" width="180" height="70" rx="8"/>
<text class="label " x="610.0" y="140.0" text-anchor="middle" dominant-baseline="middle">Slice(1)</text>
<rect class="soft" x="430" y="210" width="180" height="70" rx="8"/>
<text class="label " x="520.0" y="245.0" text-anchor="middle" dominant-baseline="middle">Slice(0)</text>
<line class="line" x1="225" y1="165" x2="430" y2="245"/>
<line class="line" x1="225" y1="220" x2="520" y2="140"/>
<text class="small" x="445" y="305" text-anchor="start">각 CLB는 2개의 Slice를 포함</text></svg>