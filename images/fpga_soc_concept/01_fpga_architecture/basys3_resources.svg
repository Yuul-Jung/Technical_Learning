<svg xmlns="http://www.w3.org/2000/svg" width="950" height="260" viewBox="0 0 950 260" role="img">
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#1d2230}
.box{fill:#ffffff;stroke:#4635B1;stroke-width:2}
.soft{fill:#f2f0ff;stroke:#8e83d9;stroke-width:1.5}
.gray{fill:#f8f8f6;stroke:#aeb3bc;stroke-width:1.5}
.dark{fill:#20242c;stroke:#20242c;stroke-width:1.5}
.darktext{fill:#ffffff}
.line{stroke:#4a4f5a;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bus{stroke:#4635B1;stroke-width:5;fill:none;opacity:.9}
.dash{stroke:#858B96;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.small{font-size:13px}
.label{font-size:15px;font-weight:700}
.title{font-size:18px;font-weight:700}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5a"/></marker></defs>
<text class="title" x="30" y="30" text-anchor="start">Basys3 Artix-7 핵심 자원</text>
<rect class="box" x="45" y="100" width="180" height="110" rx="8"/>
<text class="label " x="135.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Logic Cells</text>
<text class="title" x="135" y="165" text-anchor="middle">33,280</text>
<rect class="box" x="265" y="100" width="180" height="110" rx="8"/>
<text class="label " x="355.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Slices</text>
<text class="title" x="355" y="165" text-anchor="middle">5,200</text>
<rect class="box" x="485" y="100" width="180" height="110" rx="8"/>
<text class="label " x="575.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Block RAM</text>
<text class="title" x="575" y="165" text-anchor="middle">1,800 Kbit</text>
<rect class="box" x="705" y="100" width="180" height="110" rx="8"/>
<text class="label " x="795.0" y="155.0" text-anchor="middle" dominant-baseline="middle">DSP Slices</text>
<text class="title" x="795" y="165" text-anchor="middle">90</text></svg>